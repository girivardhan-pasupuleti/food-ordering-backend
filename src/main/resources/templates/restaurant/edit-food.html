<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Food</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body p-4">

            <h2 class="mb-4">
                Edit Food Item
            </h2>

            <form
                th:action="@{/restaurant/edit-food/{id}(id=${foodItem.id})}"
                method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Food Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        th:value="${foodItem.name}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="3"
                        required
                        th:text="${foodItem.description}">
                    </textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Price
                    </label>

                    <input
                        type="number"
                        name="price"
                        class="form-control"
                        step="0.01"
                        min="0"
                        th:value="${foodItem.price}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Category
                    </label>

                    <select
                        name="categoryId"
                        class="form-select"
                        required>

                        <option
                            th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}"
                            th:selected="${category.id == foodItem.category.id}">
                        </option>

                    </select>

                </div>

                <div class="form-check mb-3">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        name="available"
                        value="true"
                        th:checked="${foodItem.available}">

                    <label class="form-check-label">
                        Food is available
                    </label>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Changes

                </button>

                <a
                    href="/restaurant/menu"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>

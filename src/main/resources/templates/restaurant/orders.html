<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Restaurant Orders</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="/restaurant/dashboard">

            🍔 Restaurant Panel

        </a>

        <div class="d-flex align-items-center gap-2">
            <a href="/restaurant/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="/restaurant/menu" class="btn btn-outline-light btn-sm">Menu</a>
            <a href="/restaurant/orders" class="btn btn-warning btn-sm">📦 Orders</a>
            <form action="/logout" method="post" class="d-inline mb-0">
                <button type="submit" class="btn btn-danger btn-sm">Logout</button>
            </form>
        </div>

    </div>

</nav>

<div class="container mt-5">

    <h2>📦 Customer Orders</h2>

    <div
        th:if="${#lists.isEmpty(orders)}"
        class="alert alert-info mt-4">

        No orders received yet.

    </div>

    <div
        th:each="order : ${orders}"
        class="card shadow-sm mt-4">

        <div class="card-body">

            <div class="row">

                <div class="col-md-3">

                    <h5>
                        Order #
                        <span th:text="${order.id}">
                            1
                        </span>
                    </h5>

                    <p>
                        Customer:
                        <strong
                            th:text="${order.customer.name}">
                            Customer
                        </strong>
                    </p>

                </div>

                <div class="col-md-3">

                    <p>
                        Address:
                    </p>

                    <span
                        th:text="${order.deliveryAddress}">
                        Address
                    </span>

                </div>

                <div class="col-md-2">

                    <strong>
                        ₹
                        <span
                            th:text="${order.totalAmount}">
                            0
                        </span>
                    </strong>

                </div>

                <div class="col-md-2">

                    <span
                        class="badge bg-primary"
                        th:text="${order.status}">
                        PLACED
                    </span>

                </div>

                <div class="col-md-2">

                    <form
                        th:action="@{/restaurant/orders/{id}/status(id=${order.id})}"
                        method="post">

                        <select
                            name="status"
                            class="form-select mb-2">

                            <option value="PLACED"
                                    th:selected="${order.status.name() == 'PLACED'}">
                                Placed
                            </option>

                            <option value="CONFIRMED"
                                    th:selected="${order.status.name() == 'CONFIRMED'}">
                                Confirmed
                            </option>

                            <option value="PREPARING"
                                    th:selected="${order.status.name() == 'PREPARING'}">
                                Preparing
                            </option>

                            <option value="OUT_FOR_DELIVERY"
                                    th:selected="${order.status.name() == 'OUT_FOR_DELIVERY'}">
                                Out for Delivery
                            </option>

                            <option value="DELIVERED"
                                    th:selected="${order.status.name() == 'DELIVERED'}">
                                Delivered
                            </option>

                            <option value="CANCELLED"
                                    th:selected="${order.status.name() == 'CANCELLED'}">
                                Cancelled
                            </option>

                        </select>

                        <button
                            type="submit"
                            class="btn btn-success btn-sm">

                            Update

                        </button>

                    </form>

                </div>

            </div>

            <hr>

            <h6>Ordered Items</h6>

            <ul>

                <li
                    th:each="item : ${order.items}">

                    <span
                        th:text="${item.foodItem.name}">
                        Food
                    </span>

                    ×

                    <span
                        th:text="${item.quantity}">
                        1
                    </span>

                </li>

            </ul>

        </div>

    </div>

</div>

</body>
</html>

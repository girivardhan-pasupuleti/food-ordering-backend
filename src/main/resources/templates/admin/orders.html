<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Orders - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin/dashboard">
            🍔 Food Ordering System - Admin
        </a>
        <div class="d-flex align-items-center gap-2">
            <a href="/admin/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="/admin/orders" class="btn btn-warning btn-sm">Orders</a>
            <form action="/logout" method="post" class="d-inline mb-0">
                <button type="submit" class="btn btn-danger btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📦 All System Orders</h2>
        <a href="/admin/dashboard" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
        No orders have been placed in the system yet.
    </div>

    <div th:unless="${#lists.isEmpty(orders)}" class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Order #</th>
                        <th>Customer</th>
                        <th>Restaurant</th>
                        <th>Delivery Address</th>
                        <th>Total Amount</th>
                        <th>Status</th>
                        <th>Order Date</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td><strong>#<span th:text="${order.id}">1</span></strong></td>
                        <td th:text="${order.customer.name}">Customer</td>
                        <td th:text="${order.restaurant.name}">Restaurant</td>
                        <td th:text="${order.deliveryAddress}">Address</td>
                        <td>₹<span th:text="${order.totalAmount}">0</span></td>
                        <td>
                            <span class="badge bg-primary" th:text="${order.status}">PLACED</span>
                        </td>
                        <td th:text="${#temporals.format(order.orderDate, 'dd-MMM-yyyy HH:mm')}">Date</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

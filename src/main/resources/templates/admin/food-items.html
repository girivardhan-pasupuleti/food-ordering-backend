<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Food Items - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin/dashboard">
            🍔 Food Ordering System - Admin
        </a>
        <div class="d-flex align-items-center gap-2">
            <a href="/admin/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
            <form action="/logout" method="post" class="d-inline mb-0">
                <button type="submit" class="btn btn-danger btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🍴 All Food Items</h2>
        <a href="/admin/dashboard" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
    </div>

    <div th:if="${#lists.isEmpty(foodItems)}" class="alert alert-info">
        No food items currently registered in the system.
    </div>

    <div th:unless="${#lists.isEmpty(foodItems)}" class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Restaurant</th>
                        <th>Price</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="food : ${foodItems}">
                        <td th:text="${food.id}">1</td>
                        <td class="fw-bold" th:text="${food.name}">Name</td>
                        <td th:text="${food.category.name}">Category</td>
                        <td th:text="${food.restaurant.name}">Restaurant</td>
                        <td>₹<span th:text="${food.price}">0</span></td>
                        <td>
                            <span th:if="${food.available}" class="badge bg-success">Available</span>
                            <span th:unless="${food.available}" class="badge bg-danger">Unavailable</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

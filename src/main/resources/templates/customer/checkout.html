<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Checkout</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="/customer/dashboard">

            🍔 Food Ordering System

        </a>

        <div>
            <a href="/customer/dashboard"
               class="btn btn-outline-light btn-sm me-2">
                🏠 Dashboard
            </a>
            <a href="/customer/cart"
               class="btn btn-outline-light btn-sm me-2">
                🛒 Cart
            </a>
            <a href="/customer/orders"
               class="btn btn-outline-light btn-sm me-2">
                📦 My Orders
            </a>
            <form action="/logout" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger btn-sm">
                    Logout
                </button>
            </form>
        </div>

    </div>

</nav>

<div class="container mt-5">

    <h2>Checkout</h2>

    <!-- Error Alert -->
    <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>

    <div class="row mt-4">

        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4>Delivery Address</h4>

                    <form
    action="/customer/order/place"
    method="post">

    <div class="mb-3">

        <label class="form-label">
            Delivery Address
        </label>

        <textarea
            name="deliveryAddress"
            class="form-control"
            rows="4"
            placeholder="Enter complete delivery address"
            required></textarea>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Payment Method
        </label>

        <select
            name="paymentMethod"
            class="form-select"
            required>

            <option value="">
                Select Payment Method
            </option>

            <option value="CASH_ON_DELIVERY">
                Cash on Delivery
            </option>

            <option value="UPI">
                UPI
            </option>

            <option value="CARD">
                Card
            </option>

        </select>

    </div>

    <button
        type="submit"
        class="btn btn-success">

        💳 Pay & Place Order

    </button>

</form>

                </div>

            </div>

        </div>

        <div class="col-md-5">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4>Order Summary</h4>

                    <hr>

                    <div
                        th:each="item : ${cart.items}"
                        class="mb-3">

                        <strong
                            th:text="${item.foodItem.name}">
                            Food
                        </strong>

                        <br>

                        Quantity:
                        <span th:text="${item.quantity}">
                            1
                        </span>

                        <br>

                        ₹
                        <span
                            th:text="${item.foodItem.price * item.quantity}">
                            0
                        </span>

                    </div>

                    <hr>

                    <p>
                        Restaurant:
                        <strong
                            th:text="${cart.items[0].foodItem.restaurant.name}">
                            Restaurant
                        </strong>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

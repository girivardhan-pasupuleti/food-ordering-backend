<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Restaurants - Food Ordering System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body class="bg-light">


<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="/customer/dashboard">
            🍔 Food Ordering System
        </a>

        <div>

            <a href="/customer/dashboard"
               class="btn btn-outline-light btn-sm me-2">
                🏠 Dashboard
            </a>

            <a href="/customer/cart"
               class="btn btn-outline-light btn-sm me-2">
                🛒 Cart
            </a>

            <a href="/customer/orders"
               class="btn btn-outline-light btn-sm me-2">
                📦 Orders
            </a>

            <form action="/logout"
                  method="post"
                  style="display:inline;">

                <button type="submit"
                        class="btn btn-danger btn-sm">
                    Logout
                </button>

            </form>

        </div>

    </div>

</nav>


<!-- CONTENT -->
<div class="container mt-5 mb-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            🍽️ Restaurants
        </h1>

        <p class="text-muted">
            Choose a restaurant and explore its delicious menu.
        </p>

    </div>


    <!-- RESTAURANT CARDS -->
    <div class="row g-4">

        <div class="col-md-6 col-lg-4"
             th:each="restaurant : ${restaurants}">

            <div class="card restaurant-card h-100">

                <!-- Restaurant Image Placeholder -->
                <div class="text-center bg-light p-4">

                    <div style="font-size:75px;">
                        🍽️
                    </div>

                </div>


                <div class="card-body">

                    <h4 class="card-title"
                        th:text="${restaurant.name}">
                        Restaurant Name
                    </h4>

                    <p class="text-muted mb-2">

                        📍
                        <span th:text="${restaurant.address}">
                            Hyderabad
                        </span>

                    </p>

                    <p class="text-muted mb-3">

                        📞
                        <span th:text="${restaurant.phone}">
                            9876543210
                        </span>

                    </p>


                    <a th:href="@{'/customer/restaurant/' + ${restaurant.id} + '/menu'}"
                       class="btn btn-primary w-100">

                        🍴 View Menu

                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- EMPTY MESSAGE -->

    <div th:if="${#lists.isEmpty(restaurants)}"
         class="alert alert-info text-center mt-4">

        <h4>😔 No Restaurants Available</h4>

        <p class="mb-0">
            Please check again later.
        </p>

    </div>

</div>


<footer class="bg-dark text-white text-center py-4">

    <p class="mb-0">
        © 2026 Food Ordering System
    </p>

</footer>


</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Food Ordering System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Create Customer Account
                    </h2>

                    <div
                        th:if="${error}"
                        class="alert alert-danger"
                        th:text="${error}">
                    </div>

                    <form
                        th:action="@{/register}"
                        th:object="${registerRequest}"
                        method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                th:field="*{name}"
                                placeholder="Enter your name">

                            <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('name')}"
                                th:errors="*{name}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                th:field="*{email}"
                                placeholder="Enter your email">

                            <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('email')}"
                                th:errors="*{email}">
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                th:field="*{password}"
                                placeholder="Enter password">

                            <div
                                class="text-danger"
                                th:if="${#fields.hasErrors('password')}"
                                th:errors="*{password}">
                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Register

                        </button>

                    </form>

                    <p class="text-center mt-3">

                        Already have an account?

                        <a href="/login">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
